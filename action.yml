name: Seasonal Activity Graph
description: Seasonal, animated contribution graph for your GitHub profile or your whole organization.
author: Julio M Cruz
branding:
  icon: grid
  color: green
inputs:
  org:
    description: User or organization login. Defaults to the owner of the repository running the workflow.
    required: false
    default: ${{ github.repository_owner }}
  token:
    description: Token used to read repositories and commits. The default token reads public repositories.
    required: false
    default: ${{ github.token }}
  output-dir:
    description: Folder where the SVG files are written.
    required: false
    default: dist
  file-name:
    description: Base name of the files. The action writes <file-name>-dark.svg, <file-name>-light.svg and <file-name>.svg, which follows the viewer's color scheme.
    required: false
    default: activity
  include-private:
    description: Count commits from private repositories the token can read. Private repositories only add to the daily totals; their names never appear.
    required: false
    default: "false"
  private-strip:
    description: Add one strip named "Private repositories" with the combined weekly commits of every private repository. Needs include-private.
    required: false
    default: "false"
  include-forks:
    description: Count commits from forked repositories.
    required: false
    default: "false"
  include-archived:
    description: Count commits from archived repositories.
    required: false
    default: "false"
  exclude-authors:
    description: Comma-separated logins or author names to leave out. Accounts ending in [bot] are always left out.
    required: false
    default: ""
  exclude-repos:
    description: Comma-separated repositories to leave out, for example a copy of an outside project that brought its whole history along.
    required: false
    default: ""
  repos:
    description: Comma-separated public repositories that get their own weekly strip under the graph. Empty means no strips.
    required: false
    default: ""
  palette:
    description: Color palette. github, ember, or seasonal, which follows the calendar in your timezone. A season also works by name, for example winter or christmas. Ignored when colors-dark and colors-light are set.
    required: false
    default: github
  animate:
    description: Light up the graph week by week when it loads, using CSS only. Viewers who prefer reduced motion see it complete right away.
    required: false
    default: "false"
  effects:
    description: Add the season's decoration, for the seasonal palettes. Falling leaves, snow, petals and more play when the graph loads, and a few pieces stay in the empty space around the squares.
    required: false
    default: "false"
  insights:
    description: Add a panel under the graph with the last 30 days day by day, languages, where the commits went, the busiest days and streaks. With animate, the busiest days also take turns on the calendar.
    required: false
    default: "false"
  colors-dark:
    description: Five comma-separated colors for the dark variant, from no activity to most activity.
    required: false
    default: ""
  colors-light:
    description: Five comma-separated colors for the light variant, from no activity to most activity.
    required: false
    default: ""
  publish:
    description: Publish the SVG files to a branch of this repository, so a README can show them. Needs contents write permission.
    required: false
    default: "false"
  publish-branch:
    description: Branch that receives the SVG files. It keeps a single commit, so the default branch stays free of daily commits.
    required: false
    default: activity
  publish-token:
    description: Token used to publish. It is separate from token, which only needs to read.
    required: false
    default: ${{ github.token }}
  timezone:
    description: IANA time zone used to group commits by day, for example America/New_York.
    required: false
    default: UTC
  title:
    description: Header text. {commits}, {contributions} and {repos} are replaced with the totals. Leave empty for the default of a user or an organization.
    required: false
    default: ""
outputs:
  total-commits:
    description: Commits counted in the last year, or contributions for a user.
  repositories:
    description: Repositories with at least one counted commit. Always 0 for a user.
runs:
  using: node24
  main: src/index.mjs
