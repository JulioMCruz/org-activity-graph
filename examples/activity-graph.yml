# Copy to .github/workflows/activity-graph.yml in your organization's .github
# repository. It redraws the graph every day and publishes the SVGs to an
# "activity" branch, so the main branch stays free of daily commits.
name: Activity graph

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: JulioMCruz/org-activity-graph@v1
        with:
          # A user or organization. Defaults to the owner of this repository.
          org: your-org
          # Public repositories that get their own weekly strip.
          repos: web-app,api
          timezone: America/New_York
          # Publish the SVGs to an "activity" branch. Needs contents: write.
          publish: true
          # Colors that change with the season and the holidays.
          # palette: seasonal
          # Light up the year week by week when the graph loads.
          # animate: true
          # Snow, falling leaves, pumpkins and more, for the seasonal palettes.
          # effects: true
          # To count private repositories too, store a read-only token as a
          # secret and uncomment these two lines. Only daily totals are shown.
          # token: ${{ secrets.ORG_ACTIVITY_TOKEN }}
          # include-private: true
          # One combined "Private repositories" strip, with no names.
          # private-strip: true
          # Repositories to leave out. Use a secret for private names, since
          # inputs show up in the public run log.
          # exclude-repos: ${{ secrets.ORG_ACTIVITY_EXCLUDE_REPOS }}
