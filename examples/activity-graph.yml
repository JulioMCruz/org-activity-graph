# Copy to .github/workflows/activity-graph.yml in your organization's .github
# repository. It redraws the graph every day and publishes the SVGs to an
# "activity" branch, so the main branch stays free of daily commits.
name: Activity graph

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: JulioMCruz/org-activity-graph@v1
        with:
          org: your-org
          # Public repositories that get their own weekly strip.
          repos: web-app,api
          timezone: America/New_York
          output-dir: dist
          # To count private repositories too, store a read-only token as a
          # secret and uncomment these two lines. Only daily totals are shown.
          # token: ${{ secrets.ORG_ACTIVITY_TOKEN }}
          # include-private: true

      - name: Publish to the activity branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b activity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update activity graph"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" activity
